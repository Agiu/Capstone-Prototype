    <title>Capstone Prototype — Discord × Xbox</title>
    <!-- Preload the above-the-fold faces so first-time visitors render the real
         fonts at first paint instead of briefly flashing a system fallback

    <link rel="preload" href="/fonts/gg-sans-Semibold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/gg-sans-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/BaseNeueTrial-CondBoldObliq.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/BaseNeueTrial-CondExtBdObliq.ttf" as="font" type="font/ttf" crossorigin />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
